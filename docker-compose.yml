services:
  backend:
    build: ./backend
    container_name: finance-backend
    volumes:
      # Windows path - use forward slashes, works in Docker Desktop
      - ./data:/app/data
    env-file: .env.prod
    environment:
      - DATA_DIR=/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: finance-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
