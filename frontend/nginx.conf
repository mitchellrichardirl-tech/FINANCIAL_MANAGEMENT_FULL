server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # No trailing slash = pass /api/accounts through unchanged
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
    }

    # ── Backend pdoc (proxied to Flask) ──
    location = /api-docs { return 301 /api-docs/; }
    location /api-docs/ {
        # Trailing path on proxy_pass = rewrite /api-docs/* -> /docs/api/*
        proxy_pass http://backend:5000/docs/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}