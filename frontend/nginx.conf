server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Public CSV download — pretty URL mapped to a specific backend endpoint
    location = /download/transactions.csv {
        proxy_pass http://backend:5000/api/transactions/export.csv;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Large/slow exports: don't buffer the whole response in nginx, allow time
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA — everything else
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Frontend TypeDoc — static files, no SPA fallback
    location = /docs { return 301 /docs/; }
    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        autoindex on;                 # helpful while debugging
        try_files $uri $uri/ =404;    # don't fall back to React app
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
    }

    # Backend pdoc
    location = /api-docs { return 301 /api-docs/; }
    location /api-docs/ {
        proxy_pass http://backend:5000/docs/api/;
    }
}